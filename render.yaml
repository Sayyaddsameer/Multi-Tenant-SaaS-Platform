services:
  # 1. The Backend API
  - type: web
    name: multi-tenant-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multi-tenant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  # 2. The Postgres Database
  - name: multi-tenant-db
    plan: free
    databaseName: saas_db
    user: admin