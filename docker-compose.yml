version: '3.8'

services:
  # 1. Database Service (MANDATORY NAME: database)
  database:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-saas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  # 2. Backend API Service (MANDATORY NAME: backend)
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      # Critical: Internal Docker DNS uses service name 'database'
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-saas_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_chars_long}
      JWT_EXPIRES_IN: 24h
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  # 3. Frontend Service (MANDATORY NAME: frontend)
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - REACT_APP_API_URL=http://localhost:5000/api
    stdin_open: true 
    tty: true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saas-network

volumes:
  db_data:

networks:
  saas-network:
    driver: bridge